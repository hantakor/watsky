<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watsky</title>
<meta name="theme-color" content="#2F7DF6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Watsky">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0F1B33; --sky:#2F7DF6; --sky-soft:#E6F0FE; --sun:#FFB020;
  --bg:#EDF2FA; --panel:#FFFFFF; --text:#12223F; --muted:#6B7A93; --line:#DCE5F2;
  --bubble-in:#FFFFFF; --bubble-out:#2F7DF6; --bubble-out-text:#FFFFFF; --read:#FFD27A; --dots:rgba(47,125,246,.06);
  --accent:#2F7DF6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1424; --panel:#13203A; --text:#E8EEF9; --muted:#8FA0BD; --line:#22314F;
    --bubble-in:#1B2A48; --sky-soft:#1A2B4C; --dots:rgba(255,255,255,.035);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1424; --panel:#13203A; --text:#E8EEF9; --muted:#8FA0BD; --line:#22314F;
  --bubble-in:#1B2A48; --sky-soft:#1A2B4C; --dots:rgba(255,255,255,.035);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* Avatars */
.av{position:relative;flex:none;border-radius:50%}
.av-in{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.av-in svg,.av-in img{width:100%;height:100%;display:block;object-fit:cover}
.av .dot{position:absolute;bottom:1px;inset-inline-start:1px;width:12px;height:12px;border-radius:50%;background:#2BC46B;border:2.5px solid var(--panel)}
.av-group{background:linear-gradient(135deg,var(--sky),var(--sun));color:#fff}

/* Custom emoji */
.ce{display:inline-block;width:1.45em;height:1.45em;vertical-align:-.35em}
.ce svg{width:100%;height:100%;display:block}
.txt.jumbo .ce{width:52px;height:52px;margin:2px}

/* Login */
.login{height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--night);position:relative;overflow:hidden}
.login::before{content:"";position:absolute;width:560px;height:560px;border-radius:50%;background:var(--sky);opacity:.2;top:-200px;left:-180px}
.login::after{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:var(--sun);opacity:.14;bottom:-110px;right:-90px}
.login-card{position:relative;z-index:1;width:100%;max-width:400px;background:var(--panel);border-radius:30px;padding:34px 26px;text-align:center}
.logo{width:72px;height:72px;margin:0 auto 12px;border-radius:23px;background:var(--sky);display:grid;place-items:center}
.login-card h1{font-size:34px;font-weight:700;letter-spacing:-.5px}
.login-card p{color:var(--muted);margin:8px 0 18px;line-height:1.8;font-size:15px}
.cast{display:flex;justify-content:center;margin-bottom:20px;direction:ltr}
.cast .av{width:46px;height:46px;margin-inline:-6px;border:3px solid var(--panel)}
.field{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:16px;margin-bottom:12px;text-align:right}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--sky);color:#fff;font-weight:700;font-size:16px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--bg);color:var(--text)}

/* App */
.app{height:100%;overflow:hidden;grid-template-rows:minmax(0,1fr);display:grid;grid-template-columns:380px 1fr;max-width:1500px;margin:0 auto;background:var(--panel)}
.side{border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.side-head{display:flex;align-items:center;gap:6px;padding:16px 16px 8px}
.side-head h2{flex:1;font-size:26px;font-weight:700;letter-spacing:-.4px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:18px;flex:none}
.icon-btn:hover{background:var(--sky-soft);color:var(--sky)}
.search{margin:6px 16px 10px;padding:12px 16px;border-radius:16px;border:none;background:var(--bg);font-size:16px;width:calc(100% - 32px)}
.list{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-bottom:8px}
.chat-item{display:flex;gap:13px;align-items:center;padding:11px 16px;width:100%;text-align:right;position:relative}
.chat-item:hover{background:var(--bg)}
.chat-item.active{background:var(--sky-soft)}
.chat-item.active::before{content:"";position:absolute;inset-block:10px;inset-inline-start:0;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--sky))}
.ci-body{flex:1;min-width:0}
.ci-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ci-name{font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-time{font-size:12px;color:var(--muted);flex:none}
.ci-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:3px}
.ci-last{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-last.live{color:var(--sky);font-weight:500}
.badge{flex:none;min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--sun);color:#3a2800;font-size:12px;font-weight:700;display:grid;place-items:center}
.side-foot{border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;font-size:14px}
.side-foot .grow{flex:1;line-height:1.5}
.side-foot small{display:block;color:var(--muted);font-size:12px}
.switch{position:relative;width:46px;height:26px;border-radius:13px;background:var(--line);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--sky)}
.switch.on::after{transform:translateX(-20px)}

/* Chat */
.chat{display:flex;flex-direction:column;min-height:0;height:100%;overflow:hidden;background:var(--bg);position:relative}
.empty{margin:auto;text-align:center;color:var(--muted);padding:30px;max-width:420px}
.empty .logo{margin-bottom:18px;width:84px;height:84px;border-radius:26px}
.empty h3{color:var(--text);font-size:24px;margin-bottom:8px}
.empty p{line-height:1.8}
.chat-head{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;flex:none}
.chat-head::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:3px;background:var(--accent)}
.back{display:none}
.ch-name{font-weight:700;font-size:17.5px}
.ch-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-sub.live{color:var(--accent);font-weight:500}
.menu{position:absolute;top:60px;inset-inline-end:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(10,20,40,.2);padding:6px;display:none;z-index:8;min-width:190px}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:right;padding:11px 12px;border-radius:9px;font-size:15px}
.menu button:hover{background:var(--bg)}
.msgs{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:18px 6% 10px;display:flex;flex-direction:column;gap:5px;
  background-image:radial-gradient(var(--dots) 1.4px,transparent 1.4px);background-size:22px 22px}
.day{align-self:center;background:var(--panel);color:var(--muted);font-size:12px;padding:4px 14px;border-radius:12px;margin:10px 0}
.msg{max-width:min(540px,78%);padding:9px 13px 6px;border-radius:18px;line-height:1.7;font-size:15.5px;overflow-wrap:anywhere;box-shadow:0 1px 1px rgba(10,20,40,.06)}
.msg.in{align-self:flex-end;background:var(--bubble-in);border-end-end-radius:5px}
.msg.out{align-self:flex-start;background:var(--bubble-out);color:var(--bubble-out-text);border-end-start-radius:5px}
.msg.bare{background:transparent;box-shadow:none;padding:2px 4px;color:var(--text)}
.msg.bare .meta{color:var(--muted)}
.msg.gifm{padding:4px 4px 6px}
.msg img.gif{display:block;max-width:100%;max-height:260px;border-radius:14px}
.msg .who{font-size:13px;font-weight:700;margin-bottom:1px}
.txt{white-space:pre-wrap}
.meta{display:flex;gap:5px;align-items:center;justify-content:flex-end;font-size:11px;opacity:.7;margin-top:1px;padding-inline:6px}
.msg.out .meta{opacity:.9}
.msg.bare .meta{opacity:1}
.tick{display:inline-flex}
.tick.read{color:var(--read)}
.msg.bare .tick.read{color:var(--sun)}
.typing{align-self:flex-end;background:var(--bubble-in);padding:12px 16px;border-radius:18px;display:flex;gap:4px;align-items:center}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.typing span{font-size:12px;color:var(--muted);margin-inline-start:6px}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

/* Stickers (animated) */
.stk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 6px}
.stk svg{width:104px;height:104px;display:block}
.stk b{font-size:15px}
.an-pulse,.an-shake,.an-bounce,.an-spin,.an-spinslow,.an-flicker,.an-sway{display:inline-block;transform-origin:center}
.an-pulse{animation:k-pulse 1s ease-in-out infinite}
.an-shake{animation:k-shake .7s ease-in-out infinite}
.an-bounce{animation:k-bounce .9s ease-in-out infinite}
.an-spin{animation:k-spin 1.2s linear infinite}
.an-spinslow{animation:k-spin 6s linear infinite}
.an-flicker{animation:k-flicker .6s ease-in-out infinite}
.an-sway{animation:k-sway 1.6s ease-in-out infinite}
@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes k-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-4deg)}40%{transform:translateX(6px) rotate(4deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes k-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes k-spin{to{transform:rotate(360deg)}}
@keyframes k-flicker{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08,1.18) rotate(2deg)}}
@keyframes k-sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}

/* Voice */
.voice{display:flex;align-items:center;gap:10px;min-width:220px}
.vplay{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:13px;flex:none}
.msg.in .vplay{background:var(--accent);color:#fff}
.wave{display:flex;align-items:center;gap:2px;height:30px;flex:1;color:#fff}
.msg.in .wave{color:var(--accent)}
.wave i{display:block;width:3px;border-radius:2px;background:currentColor;opacity:.35}
.wave i.on{opacity:1}
.vdur{font-size:12px;opacity:.9;min-width:34px;text-align:end}

/* Composer */
.chips{display:flex;gap:8px;padding:6px 14px 0;overflow-x:auto;flex:none}
.chips button{flex:none;padding:8px 14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);font-size:14px}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.composer{display:flex;gap:8px;align-items:center;padding:10px 12px;flex:none}
.composer .box{flex:1;display:flex;align-items:center;background:var(--panel);border-radius:26px;padding:0 6px;border:1px solid var(--line);min-width:0}
.composer input[type=text]{flex:1;padding:13px 6px;border:none;background:transparent;font-size:16px;min-width:0;outline:none}
.send{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.send:hover{filter:brightness(1.08)}
.send svg{transform:scaleX(-1)}
.recbar{display:none;flex:1;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:0 8px;height:50px;min-width:0}
.composer.rec .box{display:none}
.composer.rec .recbar{display:flex}
.recdot{width:11px;height:11px;border-radius:50%;background:#E53935;animation:k-pulse 1s infinite;flex:none}
.rectxt{flex:1;font-size:15px;color:var(--muted)}
#recTime{font-weight:700;color:var(--text);min-width:40px}

/* Panel */
.panel{position:absolute;bottom:70px;inset-inline-start:12px;width:370px;max-width:calc(100% - 24px);height:350px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 36px rgba(10,20,40,.25);display:none;flex-direction:column;z-index:6;overflow:hidden}
.panel.show{display:flex}
.ptabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.ptabs button{flex:1;padding:11px 4px;font-size:13.5px;color:var(--muted)}
.ptabs button.on{color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent);font-weight:700}
.psearch{margin:8px;padding:9px 14px;border-radius:12px;border:none;background:var(--bg);font-size:16px;width:calc(100% - 16px);flex:none}
.pgrid{flex:1;min-height:0;overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;align-content:start;scrollbar-width:thin}
.pgrid > button{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;padding:6px;font-size:24px}
.pgrid > button:hover{background:var(--sky-soft)}
.pgrid .ce{width:100%;height:100%}
.pgrid.sgrid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
.pgrid.sgrid > button{aspect-ratio:auto;gap:2px;font-size:13px}
.pgrid.sgrid svg{width:64px;height:64px}
.pgrid.ggrid{grid-template-columns:repeat(3,1fr)}
.addgif{grid-column:1/-1;aspect-ratio:auto!important;padding:12px!important;background:var(--sky-soft);color:var(--accent);font-size:14px!important;font-weight:700}
.gcell{position:relative;aspect-ratio:1}
.gcell > button:first-child{width:100%;height:100%;border-radius:12px;overflow:hidden;padding:0}
.gcell img{width:100%;height:100%;object-fit:cover;display:block}
.gdel{position:absolute;top:3px;inset-inline-end:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.pnote{grid-column:1/-1;color:var(--muted);text-align:center;padding:18px 10px;font-size:14px;line-height:1.8}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--night);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:30;display:none;max-width:90%;text-align:center;line-height:1.6}
.toast.show{display:block}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,18,35,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.show{display:flex}
.sheet{background:var(--panel);border-radius:22px;padding:22px;width:100%;max-width:400px;max-height:85vh;overflow-y:auto}
.sheet h3{margin-bottom:14px;font-size:19px}
.opt{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:12px;width:100%;text-align:right;cursor:pointer}
.opt:hover{background:var(--bg)}
.opt input{width:18px;height:18px;accent-color:var(--sky)}
.row{display:flex;gap:8px;margin-top:14px}

@media (max-width:780px){
  .app{grid-template-columns:1fr}
  .chat{display:none}
  .app.open .side{display:none}
  .app.open .chat{display:flex}
  .back{display:grid}
  .msg{max-width:86%}
  .msgs{padding-inline:12px}
}
@media (prefers-reduced-motion:reduce){
  .typing i,.recdot,.an-pulse,.an-shake,.an-bounce,.an-spin,.an-spinslow,.an-flicker,.an-sway{animation:none}
  .switch,.switch::after{transition:none}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="picFile" accept="image/*" hidden>
<input type="file" id="gifFile" accept="image/gif,image/webp,image/apng" hidden>

<div class="modal" id="modalGroup" role="dialog" aria-modal="true">
  <div class="sheet">
    <h3>مجموعة جديدة</h3>
    <input class="field" id="groupName" placeholder="اسم المجموعة" maxlength="30">
    <div id="groupMembers"></div>
    <div class="row">
      <button class="btn" id="createGroup">إنشاء المجموعة</button>
      <button class="btn ghost" id="cancelGroup">إلغاء</button>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY='watsky_v2';

  /* ---------- إيموجي الأنمي (رسوم خاصة) ---------- */
  var K='stroke="#3b2a22" stroke-width="3" stroke-linecap="round" fill="none"';
  function F(inner){ return '<circle cx="32" cy="33" r="27" fill="#FFE3C2" stroke="#E2B48B" stroke-width="2"/>'+inner; }
  function star(x,y){ return '<path transform="translate('+x+' '+y+')" d="M0-8L2.4-2.4 8 0 2.4 2.4 0 8-2.4 2.4-8 0-2.4-2.4Z" fill="#FFB020" stroke="#C77F00" stroke-width="1"/>'; }
  var cheeks='<ellipse cx="17" cy="41" rx="4" ry="2.5" fill="#FF8A9B" opacity=".7"/><ellipse cx="47" cy="41" rx="4" ry="2.5" fill="#FF8A9B" opacity=".7"/>';
  var petals=''; [0,72,144,216,288].forEach(function(a){ petals+='<path transform="rotate('+a+')" d="M0 -4Q-12 -14 -8 -26Q0 -22 0 -29Q0 -22 8 -26Q12 -14 0 -4Z" fill="#FFB7C5" stroke="#E57C93" stroke-width="1.5" stroke-linejoin="round"/>'; });
  var EM={
    sparkle:{label:'عيون لامعة',svg:F(star(22,29)+star(42,29)+'<path d="M24 43Q32 51 40 43" '+K+'/>')},
    sweat:{label:'عرق وتوتر',svg:F('<circle cx="22" cy="30" r="3" fill="#3b2a22"/><circle cx="42" cy="30" r="3" fill="#3b2a22"/><path d="M23 45Q27.5 41 32 45T41 45" '+K+'/><path d="M50 8Q57 19 50 25Q43 19 50 8Z" fill="#6EC6FF" stroke="#2E8BC0" stroke-width="1.5"/>')},
    anger:{label:'غضب',svg:F('<path d="M15 21L28 28M49 21L36 28" stroke="#3b2a22" stroke-width="4" stroke-linecap="round"/><circle cx="23" cy="33" r="3" fill="#3b2a22"/><circle cx="41" cy="33" r="3" fill="#3b2a22"/><path d="M24 48Q32 40 40 48" '+K+'/><path d="M46 6Q50 11 54 6M46 16Q50 11 54 16" stroke="#E53935" stroke-width="3.5" stroke-linecap="round" fill="none"/>')},
    blush:{label:'خجل',svg:F('<path d="M17 31Q22 25 27 31M37 31Q42 25 47 31" '+K+'/><ellipse cx="18" cy="40" rx="5" ry="3" fill="#FF8A9B" opacity=".75"/><ellipse cx="46" cy="40" rx="5" ry="3" fill="#FF8A9B" opacity=".75"/><path d="M29 44Q32 47 35 44" '+K+'/>')},
    cry:{label:'بكاء',svg:F('<path d="M17 29Q22 24 27 29M37 29Q42 24 47 29" '+K+'/><path d="M21 31Q14 44 16 58M43 31Q50 44 48 58" stroke="#6EC6FF" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M25 44Q32 54 39 44Z" fill="#C0392B" stroke="#3b2a22" stroke-width="2" stroke-linejoin="round"/>')},

  /* ---------- عرض الرسائل ---------- */

    return '<div class="voice"><button class="vplay" data-id="'+m.id+'" aria-label="تشغيل">▶</button><div class="wave" data-id="'+m.id+'">'+bars+'</div><span class="vdur" data-id="'+m.id+'">'+fmtDur(m.dur||0)+'</span></div>';
  }

      var who=(!out&&c.group)?'<div class="who" style="color:'+colorOf(m.from)+'">'+esc(nameOf(m.from))+'</div>':'';

  /* ---------- تشغيل الرسائل الصوتية ---------- */
  function findMsg(id){ var c=getChat(active); return c&&c.msgs.filter(function(x){ return x.id===id; })[0]; }
  function togglePlay(id){
    var m=findMsg(id); if(!m||!m.audio) return;
    if(P.id===id&&P.audio){ if(P.audio.paused) P.audio.play(); else P.audio.pause(); return; }
    stopPlayer();
    var a=new Audio(m.audio); P={id:id,audio:a,dur:m.dur||0};
    a.ontimeupdate=syncPlayer; a.onpause=syncPlayer; a.onplay=syncPlayer;
    a.onended=function(){ stopPlayer(); };
    a.play().catch(function(){ toast('تعذّر تشغيل الصوت.'); stopPlayer(); });
  }
  function resetPlayerUI(id){
    var b=document.querySelector('.vplay[data-id="'+id+'"]'); if(b) b.textContent='▶';
    var w=document.querySelector('.wave[data-id="'+id+'"]');
    if(w) Array.prototype.forEach.call(w.children,function(x){ x.classList.remove('on'); });
    var m=findMsg(id), d=document.querySelector('.vdur[data-id="'+id+'"]'); if(d&&m) d.textContent=fmtDur(m.dur||0);
  }
  function stopPlayer(){
    var old=P.id;
    if(P.audio){ try{ P.audio.pause(); }catch(e){} }
    P={id:null,audio:null};
    if(old) resetPlayerUI(old);
  }
  function syncPlayer(){
    if(!P.id||!P.audio) return;
    var a=P.audio, total=isFinite(a.duration)&&a.duration>0?a.duration:(P.dur||1);
    var b=document.querySelector('.vplay[data-id="'+P.id+'"]'); if(b) b.textContent=a.paused?'▶':'❚❚';
    var w=document.querySelector('.wave[data-id="'+P.id+'"]');
    if(w){ var n=Math.round(Math.min(1,a.currentTime/total)*w.children.length); Array.prototype.forEach.call(w.children,function(x,i){ x.classList.toggle('on',i<n); }); }
    var d=document.querySelector('.vdur[data-id="'+P.id+'"]'); if(d) d.textContent=fmtDur(a.currentTime);
  }

  /* ---------- تسجيل الصوت ---------- */
  async function startRec(){
    if(R) return;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){ toast('هذا المتصفح لا يدعم تسجيل الصوت.'); return; }
    var stream;
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ toast('تعذّر الوصول إلى الميكروفون. اسمح له من إعدادات المتصفح، وقد لا يعمل داخل بعض الإطارات.'); return; }
    var rec, chunks=[];
    try{ rec=new MediaRecorder(stream); }catch(e){ stream.getTracks().forEach(function(t){ t.stop(); }); toast('تعذّر بدء التسجيل.'); return; }
    var r={rec:rec,stream:stream,t0:Date.now(),send:false,transcript:'',sr:null,timer:null};
    R=r;
    rec.ondataavailable=function(ev){ if(ev.data&&ev.data.size) chunks.push(ev.data); };
    rec.onstop=async function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      if(!r.send) return;
      await sleep(600);
      var secs=(Date.now()-r.t0)/1000;
      if(secs<0.8){ toast('التسجيل قصير جداً.'); return; }
      var blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});
      var fr=new FileReader();
      fr.onload=function(){ sendRaw({audio:fr.result,dur:Math.round(secs),transcript:(r.transcript||'').trim()}); };
      fr.readAsDataURL(blob);
    };
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(SR){
      try{
        var sr=new SR(); sr.lang='ar-SA'; sr.continuous=true; sr.interimResults=false;
        sr.onresult=function(ev){ for(var i=ev.resultIndex;i<ev.results.length;i++){ if(ev.results[i].isFinal) r.transcript+=ev.results[i][0].transcript+' '; } };
        sr.onerror=function(){};
        sr.start(); r.sr=sr;
      }catch(e){}
    }
    rec.start();
    var comp=$('#composer'); if(comp) comp.classList.add('rec');
    r.timer=setInterval(function(){
      var s=(Date.now()-r.t0)/1000, el=$('#recTime'); if(el) el.textContent=fmtDur(s);
      if(s>=90){ stopRec(true); }
    },250);
  }
  function stopRec(send){
    var r=R; if(!r) return; R=null;
    r.send=send; clearInterval(r.timer);
    try{ if(r.sr) r.sr.stop(); }catch(e){}
    try{ if(r.rec.state!=='inactive') r.rec.stop(); }catch(e){}
    var comp=$('#composer'); if(comp) comp.classList.remove('rec');
    var el=$('#recTime'); if(el) el.textContent='0:00';
  }

  /* ---------- الإرسال ---------- */
  function sendMsg(text){ sendRaw({text:text}); }
  function sendRaw(part){
    var c=getChat(active); if(!c) return;
    var chips=$('#chips'); if(chips) chips.remove();
    var m=Object.assign({id:uid(),from:'me',text:'',t:Date.now(),status:'sent'},part);
    c.msgs.push(m); save(); refresh(c);
    setTimeout(function(){ if(m.status==='sent'){ m.status='delivered'; save(); refresh(c); } },600);
    setTimeout(function(){
      c.msgs.forEach(function(x){ if(x.from==='me') x.status='read'; });
      save(); refresh(c); respond(c);
    },1500);
  }

  /* ---------- ربط الذكاء ---------- */
  function getSample(){
    if(sampleP) return sampleP;
    var API_URL='/api/chat';
    function toMsgs(input){ return typeof input==='string'?[{role:'user',content:input}]:input; }
    async function call(input,opts){
      var headers={'content-type':'application/json'}, code='';
      try{ code=localStorage.getItem('watsky_code')||''; }catch(e){}
      if(code) headers['x-app-code']=code;
      var res;
      try{
        res=await fetch(API_URL,{method:'POST',headers:headers,body:JSON.stringify({messages:toMsgs(input),tier:(opts&&opts.modelTier==='default')?'smart':'quick'})});
      }catch(e){ throw {code:'network_error'}; }
      if(res.status===401) throw {code:'need_code'};
      if(res.status===429) throw {code:'rate_limited'};
      if(!res.ok) throw {code:'upstream_error'};
      var data=await res.json(), text=(data.text||'').trim();
      if(!text) throw {code:'empty_completion'};
      if(opts&&opts.onText) opts.onText({text:text,delta:text});
      return {text:text,truncated:false};
    }
    var s=function(input,opts){ return call(input,opts); };
    s.json=async function(input,opts){
      var r=await call(input,opts), t=r.text.replace(/```json|```/g,'').trim();
      var a=t.indexOf('['), b=t.lastIndexOf(']'); if(a>-1&&b>a) t=t.slice(a,b+1);
      try{ return JSON.parse(t); }catch(e){ throw {code:'invalid_json',text:r.text}; }
    };
    sampleP=Promise.resolve(s);
    return sampleP;
  }

  var EMOJI_HINT=(function(){
    var a=[]; Object.keys(EM).forEach(function(k){ a.push(':'+k+': ('+EM[k].label+')'); }); return a.join('، ');
  })();

  function rulesFor(id){
    var ch=CH[id];
    var len=ch.style?('- أسلوب كلامك (مهم جداً، التزم به دائماً): '+ch.style):'- اكتب مثل رسائل الدردشة: من جملة إلى ثلاث جمل غالباً، وأطول فقط إن احتاج السؤال شرحاً.';
    return 'أنت تمثّل شخصية الأنمي «'+ch.name+'» داخل تطبيق مراسلة اسمه Watsky، والمستخدم اسمه «'+S.me+'».\n'+
      'الشخصية: '+ch.persona+'\n\n'+
      'قواعد الرد:\n'+
      '- ابقَ في الشخصية دائماً بأسلوبها وطباعها ومفرداتها كما تظهر في الأنمي الأصلي.\n'+
      '- افهم رسالة المستخدم بدقة وأجب عمّا سأل فعلاً. إن سأل عن معلومة أو مشورة أو شرح أو دراسة أو برمجة فقدّم مساعدة صحيحة ومفيدة بصوت الشخصية.\n'+
      len+'\n'+
      '- ردّ بلغة المستخدم (العربية افتراضياً بفصحى مبسّطة أو لهجة خفيفة).\n'+
      '- قد يرسل المستخدم إيموجي أنمي برموز بين نقطتين أو ملصقات أو GIF أو رسائل صوتية (تصلك كنص بين أقواس مربعة)، فتجاوب معها بطبيعية. يمكنك أحياناً (وليس دائماً) استخدام إيموجي أنمي بكتابة رمزه، والرموز: '+EMOJI_HINT+'.\n'+
      '- لا تذكر أنك ذكاء اصطناعي، ولا تبدأ ردك باسمك، ولا تكتب أوصاف حركات بين نجوم.\n'+
      '- إن طُلب منك شيء ضار أو خطير في الواقع فارفض بلطف وبأسلوب الشخصية.';
  }

  function buildTurns(c){
    var out=[{role:'user',content:rulesFor(c.id)+'\n\n(ابدأ المحادثة)'}];
    c.msgs.slice(-16).forEach(function(m){
      var role=m.from==='me'?'user':'assistant', t=aiText(m);
      if(!t) return;
      var last=out[out.length-1];
      if(last.role===role) last.content+='\n'+t; else out.push({role:role,content:t});
    });
    if(out[out.length-1].role!=='user') out.push({role:'user',content:'(تابع)'});
    return out;
  }

  function buildGroupPrompt(c){
    var people='';
    c.members.forEach(function(id){ people+='- '+id+' = '+CH[id].name+': '+CH[id].persona+(CH[id].style?' أسلوب كلامه: '+CH[id].style:'')+'\n'; });
    var log='';
    c.msgs.slice(-14).forEach(function(m){ log+=(m.from==='me'?S.me+' (المستخدم)':CH[m.from].name)+': '+aiText(m)+'\n'; });
    return 'أنت تدير مجموعة دردشة في تطبيق Watsky اسمها «'+c.name+'» فيها المستخدم «'+S.me+'» وشخصيات أنمي. هؤلاء أعضاء المجموعة:\n'+people+
      '\nسجل المحادثة:\n'+log+
      '\nاكتب الرد القادم: اختر من شخصية إلى ثلاث شخصيات يناسبها الرد على آخر رسالة، ويمكنها أن تتجاوب مع بعضها أيضاً.\n'+
      'القواعد: كل شخصية تبقى في طباعها وأسلوبها كما في الأنمي الأصلي، وتفهم كلام المستخدم بدقة وتجيب عمّا سأل فعلاً، ملتزمة بطول كلامها المذكور، وبجملة إلى ثلاث جمل بلغة المستخدم (العربية افتراضياً). قد يرسل المستخدم إيموجي أو ملصقات أو GIF أو رسائل صوتية تصل كنص بين أقواس. يمكن أحياناً استخدام رموز إيموجي الأنمي مثل '+EMOJI_HINT+'. لا تذكروا أنكم ذكاء اصطناعي. ارفضوا بلطف أي طلب ضار في الواقع.\n'+
      'أخرج JSON فقط، مصفوفة بهذا الشكل بدون أي نص آخر: [{"who":"luffy","text":"..."}]. قيم who المسموحة: '+c.members.join(', ')+'.';
  }

  function pushMsg(c,from,text){
    c.msgs.push({id:uid(),from:from,text:text,t:Date.now()});
    if(active!==c.id) c.unread=(c.unread||0)+1;
    save();
  }

  async function respond(c){
    if(c.pending){ c.again=true; return; }
    c.pending={who:c.group?'':c.id,text:''}; refresh(c);
    var sample=null;
    try{
      sample=aiOff?null:await getSample();
      if(!sample){ await fallback(c); }
      else if(c.group){ await groupReply(c,sample); }
      else { await soloReply(c,sample); }
    }catch(e){
      await handleErr(c,e);
    }
    c.pending=null; refresh(c);
    if(c.again){ c.again=false; respond(c); }
  }

  async function soloReply(c,sample){
    var r=await sample(buildTurns(c),{
      cache:false, modelTier:S.smart?'default':'quick',
      onText:function(o){ if(c.pending){ c.pending.text=o.text; if(active===c.id) renderMsgs(); } }
    });
    var t=(r.text||'').trim();
    c.pending=null;
    if(t) pushMsg(c,c.id,t);
  }

  async function groupReply(c,sample){
    var arr=await sample.json(buildGroupPrompt(c),{cache:false,modelTier:S.smart?'default':'quick'});
    if(!Array.isArray(arr)) arr=[arr];
    var ok=arr.filter(function(x){ return x&&typeof x.text==='string'&&x.text.trim()&&c.members.indexOf(x.who)>-1; }).slice(0,3);
    if(!ok.length) throw {code:'empty_completion'};
    for(var i=0;i<ok.length;i++){
      c.pending={who:ok[i].who,text:''}; refresh(c);
      await sleep(Math.min(2200,600+ok[i].text.length*18));
      c.pending=null; pushMsg(c,ok[i].who,ok[i].text.trim()); refresh(c);
    }
  }

  async function fallback(c){
    var who=c.group?c.members[Math.floor(Math.random()*c.members.length)]:c.id;
    c.pending={who:who,text:''}; refresh(c);
    await sleep(1200);
    var f=CH[who].fallback;
    c.pending=null; pushMsg(c,who,f[Math.floor(Math.random()*f.length)]);
    if(!c._warned){ c._warned=true; toast('الردود الذكية غير متاحة الآن، تظهر ردود جاهزة بدلاً منها.'); }
  }

  async function handleErr(c,e){
    var code=e&&e.code;
    if(e&&e.text&&e.text.trim()&&!c.group){ c.pending=null; pushMsg(c,c.id,e.text.trim()); }
    if(code==='cancelled') return;
    if(code==='need_code'){
      c.pending=null;
      var v=window.prompt('أدخل رمز الدخول الخاص بتطبيقك');
      if(v&&v.trim()){ try{ localStorage.setItem('watsky_code',v.trim()); }catch(e4){} toast('تم حفظ الرمز. أعد إرسال رسالتك.'); }
      else toast('الرمز مطلوب لتفعيل الردود.');
      return;
    }
    if(code==='network_error'){ c.pending=null; toast('لا يوجد اتصال بالإنترنت. تحقق من الشبكة ثم أعد المحاولة.'); return; }
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].indexOf(code)>-1){
      aiOff=true; toast('لم يتم السماح باستخدام Claude، لذلك ستظهر ردود جاهزة. أعد فتح الصفحة واسمح بالاستخدام لتفعيل الذكاء.');
      c.pending=null; await fallback(c); return;
    }
    if(code==='rate_limited') toast('الطلبات كثيرة أو انتهى حد الاستخدام. انتظر قليلاً ثم أعد المحاولة.');
    else if(code==='session_expired') toast('انتهت الجلسة. سجّل الدخول مجدداً ثم أعد المحاولة.');
    else toast('تعذّر الرد هذه المرة. أرسل رسالتك مرة أخرى.');
  }

  /* ---------- صورة الشخصية ---------- */
  $('#picFile').onchange=function(e){
    var f=e.target.files[0]; e.target.value=''; if(!f||!active||!CH[active]) return;
    var id=active, r=new FileReader();
    r.onload=function(){
      var img=new Image();
      img.onload=function(){
        var s=Math.min(img.width,img.height), cv=document.createElement('canvas'); cv.width=cv.height=220;
        cv.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,220,220);
        S.pics[id]=cv.toDataURL('image/jpeg',.85); save(); renderList(); renderChat(); toast('تم تغيير الصورة');
      };
      img.src=r.result;
    };
    r.readAsDataURL(f);
  };

  /* ---------- المجموعات ---------- */
  function openGroup(){
    var h='';
    ORDER.forEach(function(id){
      h+='<label class="opt"><input type="checkbox" value="'+id+'">'+avatar(id,38)+'<span>'+esc(CH[id].name)+'</span></label>';
    });
    $('#groupMembers').innerHTML=h; $('#groupName').value='';
    $('#modalGroup').classList.add('show'); $('#groupName').focus();
  }
  $('#cancelGroup').onclick=function(){ $('#modalGroup').classList.remove('show'); };
  $('#createGroup').onclick=function(){
    var name=$('#groupName').value.trim();
    var members=Array.prototype.map.call(document.querySelectorAll('#groupMembers input:checked'),function(i){ return i.value; });
    if(!name||members.length<2){ toast('اكتب اسم المجموعة واختر شخصيتين على الأقل.'); return; }
    var c={id:'g_'+uid(),name:name,group:true,members:members,unread:0,msgs:[{id:uid(),from:members[0],text:'تم إنشاء المجموعة! 🎉',t:Date.now()}]};
    S.chats.push(c); save(); $('#modalGroup').classList.remove('show'); renderApp(); openChat(c.id);
  };
  document.querySelector('#modalGroup').addEventListener('click',function(e){ if(e.target===this) this.classList.remove('show'); });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){ $('#modalGroup').classList.remove('show'); var m=$('#menu'); if(m) m.classList.remove('show'); closePanel(); }
  });
  document.addEventListener('click',function(e){
    var m=$('#menu'); if(m&&m.classList.contains('show')&&!m.contains(e.target)) m.classList.remove('show');
    var p=$('#panel'); if(p&&p.classList.contains('show')&&!p.contains(e.target)&&!e.target.closest('#btnEmoji')) p.classList.remove('show');
  });

  function toggleTheme(){
    var root=document.documentElement;
    var dark=root.getAttribute('data-theme')==='dark' ||
      (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var next=dark?'light':'dark'; root.setAttribute('data-theme',next); S.theme=next; save();
  }
  if(S.theme) document.documentElement.setAttribute('data-theme',S.theme);

  if(S.me&&S.chats.length&&getChat('luffy')) renderApp(); else renderLogin();
})();
</script>

if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
